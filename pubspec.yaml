name: no_backend_frontend
description: "RailGo - Next-Gen IRCTC Frontend (No Backend, 100% Local Storage)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#1A3C8F"
  adaptive_icon_foreground: "assets/icons/app_logo_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/

